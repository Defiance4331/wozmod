# The slow checks a change needs, for tools/verify.py, which reads this file from the merge base with main (a change
# cannot edit the list that judges it).
#
# Each row: when the diff from the merge base touches a path matching one of `paths` (fnmatch: `*` also matches `/`),
# tools/verify.py prints the row, and `tools/verify.py --triggered` runs it under the machine lock: `run` is pytest
# paths or node ids (strict, every slow switch on), or `ref STEP` (a reference build and its readers, run with the
# row's tests: name the steps they read). `from` cites the incident or commit behind it; a row with nothing to cite
# does not belong here. Prune a row whose check has not gone red in a long while.

[[row]]
name = "runtime builds"
paths = ["runtime/*", "src/wozmod/runtime/*", "data/true_rate/*"]
run = ["tests/test_runtime_build.py", "tests/test_runtime_guards.py", "tests/test_runtime_crash_log.py",
       "tests/test_install_stock.py", "tests/test_text_contexts.py"]
from = """#11 (88e0639), #12 (e4fed46) and #18 (bf81034) changed runtime/ and src/wozmod/runtime/guards.py; #20 (4bbb7f9)
changed data/true_rate/, which the DLL build reads (src/wozmod/runtime/true_rate.py). e348400: the crash-log tests
timed out in the release run. The DLL pin is no longer checked here: the release build writes it and verify release
compares it with a fresh build (installer decision 55; it changed in 18 commits from 11-05 to 11-19)."""

[[row]]
name = "the install end to end"
paths = ["src/wozmod/install/*", "src/wozmod/donors/*", "src/wozmod/discs/*", "src/wozmod/platform/*",
         "src/wozmod/__main__.py", "src/wozmod/window.py", "packaging/*"]
run = ["ref text", "ref voices", "ref art",
       "tests/test_install_e2e.py::test_the_dll_accepts_every_file_the_install_wrote",
       "tests/test_install_e2e.py::test_a_second_install_keeps_every_step_and_leaves_the_files_of_the_first",
       "tests/test_install_e2e.py::test_a_changed_step_key_rebuilds_only_that_step_and_the_same_files",
       "tests/test_install_e2e.py::test_install_lists_every_file_it_wrote_and_uninstall_restores_the_stock_folder"]
from = """25b6ae9 (file access on Windows) and 8f20076 (the smaller download) changed install/, donors/ and packaging/;
units 4a and 4b proved the read gate on it. It installs over the reference builds' steps, as an update keeps them: a
first install with its release files took 301 of its 376 s (run of 2026-11-20 00:51, tree 93634494). The first
install, timed, is tools/verify.py release's, alone: in the 84 verify runs the machine-lock log held on 2026-11-17,
its time budget was 7 of the 22 red ones, none a product bug."""

[[row]]
name = "reference builds and their readers"
paths = ["src/*", "data/*", "native/*", "uv.lock", "pyproject.toml", "tools/stock_pieces.py"]
run = ["ref text", "ref voices", "ref art"]
from = """The hybrid plan, unit 5: one build per step key, its trace, and its byte diff against main's. Unit 2 (D6) needs
the voices output byte-identical to main's. A build is reused while its step key holds, so an edit outside a step's
closure costs only the key. The stale stock-pieces call: tools/stock_pieces.py called _voice_banks with 4 of its 5
arguments and nothing ran it (work/handbacks/slow-survey.md); the readers hold the record to what the builds read.
9259ead changed tests/test_stock_pieces.py."""

[[row]]
name = "menu art and lettering"
paths = ["src/wozmod/art/*", "src/wozmod/fonts/*", "data/art/*"]
run = ["ref art", "tests/test_art_build.py", "tests/test_fonts_rendering.py", "tests/test_fonts_face_source.py"]
from = """e348400: the release run failed in test_fonts_face_source after the Latin font cells changed. 487f927 and
2c360a0 changed the menu art build."""

[[row]]
name = "no official English in the tracked files"
paths = ["src/wozmod/art/*", "src/wozmod/fonts/*", "data/art/*"]
run = ["tests/test_repository_hygiene.py"]
from = """e348400: the release run failed in the official-English check after an art build's state leaked. It reads the
checkout's tracked files (git), so it runs in the checkout, not beside the reference builds."""

[[row]]
name = "voices, effects and Dream movies"
paths = ["src/wozmod/voices/*", "src/wozmod/formats/audio.py", "src/wozmod/formats/pmf.py", "native/*"]
run = ["ref voices",
       "tests/test_voices_lips.py::test_each_english_clip_gets_the_block_its_donor_plays_with_it_or_one_made_from_its_speech",
       "tests/test_voices_lips.py::test_a_line_without_its_own_block_gets_the_shapes_its_sound_had_in_the_lines_with_one",
       "tests/test_voices_lips.py::test_a_sound_shorter_than_any_run_of_the_known_mouths_does_not_change_the_mouth",
       "tests/test_voices_lips.py::test_the_phones_choose_between_shapes_that_sound_alike",
       "tests/test_voices_lips.py::test_every_track_runs_the_whole_of_a_long_line",
       "tests/test_dream_events.py", "tests/test_dream_movies.py",
       "tests/test_formats_audio.py", "tests/test_shout_banks.py", "tests/test_runtime_edits.py"]
from = """9259ead (the Dream cutscenes in English) changed test_voices_lips and test_dream_movies. #11 (88e0639) changed
the effect banks and tests/test_runtime_edits.py (the sound pool test). f19a297 changed test_shout_banks. The lip tests
are named one by one, not as the file: the learned-mouths test, 330 s, has the row below, and a file in this row would
keep it here (tools/verify.py release also reads a row's tests as readers and leaves them out of its slow suite)."""

[[row]]
name = "lip-sync generator"
paths = ["src/wozmod/voices/lips.py", "src/wozmod/voices/phones.py", "native/src/lips.rs", "native/src/speech.rs",
         "native/build.rs", "native/csrc/*", "native/patches/*", "native/Cargo.toml", "native/Cargo.lock",
         "tests/test_voices_lips.py"]
run = ["tests/test_voices_lips.py::test_learned_mouths_give_koeis_shapes_on_lines_they_did_not_learn_from"]
from = """The owner's decision, 2026-11-20: run it only on lip-sync changes. The test reruns half the voices build,
about 330 s, and scores the generated mouth shapes against Koei's. It ran on every voice change; it now runs when
the code that makes the shapes changes: lips.py, phones.py, and the Rust they call (lips.rs for lip_shapes, speech.rs for aligned_phones and heard_phones, built with build.rs, csrc/,
patches/ and the pinned crates). tools/verify.py release still runs it, in its slow suite."""

[[row]]
name = "text room and subtitle contexts"
paths = ["src/wozmod/text/*", "data/text/*", "src/wozmod/runtime/text_table.py", "src/wozmod/runtime/camp_plate.py",
         "src/wozmod/voices/*"]
run = ["tests/test_text_room.py", "tests/test_text_boxes.py", "tests/test_camp_plate.py",
       "tests/test_subtitle_contexts.py"]
from = """79ae6c0 (long English text crashed the game) and 56af5a5 changed test_text_room; 02611ef changed the battle
text boxes; 963fc58 changed test_subtitle_contexts. The voice maps decide which lines keep Japanese: officers 92
and 93's 28 copied battle quotes played Japanese under official subtitles until the copy rule (decisions ledger,
text row 46), which only the subtitle contexts' Japanese-voice check sees."""

# The slow tests that read a step's reference build (tests/conftest.py, the built fixture) instead of building the
# step themselves. tools/verify.py ref runs them against the build it made, and so does a row's `ref`, with the row's
# tests. A reader of several steps is listed under one of them; alone, `ref` of that step builds the others in it.
[readers]
text = ["tests/test_text_movie_captions.py"]
voices = ["tests/test_voices_events.py::test_every_english_voiced_event_line_ends_with_its_clip",
          "tests/test_runtime_edits.py::test_sound_pool_holds_every_english_effect_bank_on_top_of_the_stock_ones",
          "tests/test_dream_movies.py::test_the_built_movie200_keeps_the_stock_lip_sync",
          "tests/test_stock_pieces.py::test_the_steps_read_exactly_the_committed_pieces"]
art = ["tests/test_art_compose.py::test_the_install_art_build_writes_only_the_player_files",
       "tests/test_art_build.py::test_a_partial_build_writes_the_entries_the_install_build_writes"]
