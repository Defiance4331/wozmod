# The past fixes tools/replay.py replays, beside the ones it finds in git log by itself (each commit on main whose
# message ends "Reported in #N", and each revert commit). Each row says why it is here.
#
# A row with `commit` narrows what the replay reverts of that commit: `revert` lists paths, a path#N,M naming only
# those hunks of the commit's diff of it (numbered from 1). Without a row, everything outside tests/ is reverted.
# A row's `edit`s change today's tree by hand (`old` must occur once): a commit's port that is mechanical but that the
# line rule cannot find, or, in a row with `name`, a bug no single commit holds, made again.

[[fix]]
