[package]
name = "wozmod-native"
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "wozmod_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py314"] }
rustfft = "6.4"
libm = "0.2"

[build-dependencies]
cc = "1.2"
flate2 = "1.1"
sha2 = "0.10"
tar = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
