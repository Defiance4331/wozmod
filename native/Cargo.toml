[package]
name = "wozmod-native"
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "wozmod_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py314"] }
rustfft = "6.4"
libm = "0.2"
# ONNX Runtime, loaded at run time from the library file the release ships (no ONNX Runtime is built or linked here).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17"] }
# The NVIDIA driver's own library, loaded at run time when the machine has one (cuda.rs): only with the cuda feature.
libloading = { version = "0.8", optional = true }
# The system's Vulkan loader, loaded at run time when the machine has one (vulkan.rs).
ash = { version = "=0.38.0", default-features = false, features = ["loaded", "std"] }
half = "2"
num_cpus = "1"

[features]
# The CUDA engine of the Dream voice separator (src/cuda.rs, which says how to turn it back on). Off: no release and
# no development build has it, by the owner's decision of 2026-11-21 (Vulkan runs every card at the same speed).
cuda = ["dep:libloading"]

[build-dependencies]
cc = "1.2"
flate2 = "1.1"
sha2 = "0.10"
tar = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# No symbol table: Python finds the module by its export, and the linker's own names spell out the build's folders
# (the MinGW import libraries are named after the folder rustc made them in).
strip = "symbols"
