[package]
name = "wozmod-native"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "wozmod_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py314"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
