[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "wozmod-native"
version = "0.4.0"
description = "Fast LZP2 and DXT5 codecs for wozmod (the Python codecs give the same bytes), its audio alignment, the mouth shapes it learns from speech, its stage-script stream alignments and the lettering faces' pixel loops."
license = "GPL-3.0-or-later"
requires-python = ">=3.14"

[tool.maturin]
module-name = "wozmod_native"

# uv reuses a built path dependency until one of these changes; by default it watches only this file, so an edit to
# the Rust or C sources kept the old module.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "build.rs" },
              { file = "src/**/*.rs" }, { file = "csrc/**" }, { file = "patches/**" }]
