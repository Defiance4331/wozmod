[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "wozmod-native"
version = "0.4.0"
description = "Fast LZP2 and DXT5 codecs for wozmod (the Python codecs give the same bytes), its audio alignment and the mouth shapes it learns from speech."
license = "GPL-3.0-or-later"
requires-python = ">=3.14"

[tool.maturin]
module-name = "wozmod_native"
