# The battle's tick dispatcher (0x4B0480): each pass runs int(debt) ticks (debt = elapsed time x the clock's rate),
# but a pass whose debt is at most 1.00001 still runs one tick. At 60 the limiter spaces passes 1/60 s apart, so the
# debt reaches about 1 every pass. At N, passes the display holds back and then lets through in a burst carry less
# than a tick's debt, and that path adds ticks the clock never earned: the game runs fast. A pass with under half a
# tick of debt runs no tick (its frame repeats); from half a tick up it runs one and pays a whole tick from the debt,
# which the stock path does only above 1.00001 (at N with jittered passes that cost 1% extra ticks). Frame skip is
# always on (runtime_edits.settings_rows), so the clock keeps its debt across presents and these passes happen.
[[site]]
va = 0x4B04A7
stock = "0f85ef000000"
kind = "patch"
class = "e"
what = "battle dispatcher: a pass with under half a tick of debt runs no tick, one with more pays for its tick"
code = """jne 1f; push 0x4b04ad; ret;
1: fcom qword ptr [0x6ce260]; fnstsw ax; test ah, 1; jz 2f;
fstp st(0); pop ebx; add esp, 4; ret;
2: fld qword ptr [0x7ab0b0]; fsub qword ptr [0x6ce3c8]; fstp qword ptr [0x7ab0b0];
push 0x4b059c; ret"""

# The present limiter (0x5CA330) waits until 1/60 s after its last exit: push 60 is the divisor of the counter's
# frequency. At N it lets N passes through a second (and leaves the pacing to VSYNC when the monitor reaches N).
[[site]]
va = 0x5CA36D
stock = "6a3c 8bea 50"
kind = "patch"
class = "e"
what = "present limiter: passes a second is the tick rate"
code = "push dword ptr [{limit}]; mov ebp, edx; push eax"

# A pass that runs several ticks (the machine fell behind) draws once and runs the frame end once; for each extra tick
# the catch-up calls the input and sound step (0x5ADE90) and the fade ramp (0x5E0E80) in place of the skipped frame.
# Those stand for a frame: they take one of the 60 Hz periods the pass's time holds beyond the first (the frame
# end's), and the frame being drawn keeps its flag.
[[site]]
va = 0x4B0534
stock = "e857d90f00 e842091300"
kind = "patch"
class = "c"
what = "catch-up: a skipped frame's stand-in steps take a 60 Hz period of the pass's own"
code = """push eax; push ecx; push edx; push 1; call dword ptr [{frame}]; add esp, 4; pop edx; pop ecx; pop eax;
{call:0x5ade90}; {call:0x5e0e80};
push eax; push ecx; push edx; push 0; call dword ptr [{frame}]; add esp, 4; pop edx; pop ecx; pop eax"""

