# True frame rate catalogue (format: see character.toml): battle timers, stage scripts, spawning and sound.
#
# Everything here counts once per battle tick (in the tick chain from 0x4AF960 or 0x5135C0) or once per frame (the
# battle scene's update 0x4B0600 and the frame end 0x4010B0, once a pass: up to N a second, fewer when the machine
# presents fewer). A tick's count steps on the ticks that complete a 60 Hz period (tick60), and each reader that
# fires on one value of a count fires only on the tick that reached it. A frame's count stands for 1/60 s and steps
# on the passes whose real time completes a 60 Hz period (frame60), whatever the passes a second.

# ---- The battle timer 0x801ECC: ticks since the battle began, capped at 0x34BC0 (60 minutes). The time limit
# (0x801ED0), the objectives (0x47AD90, minutes), the HUD clock and the off-field march (0x438F10, timer difference
# times speed) read it as a 60 Hz count.
[[site]]
va = 0x4AFB39
stock = "83c001 3dc04b0300"
kind = "gate"
class = "c"
what = "battle timer 0x801ECC +1 a tick (end of 0x4AF960); the jg after the cmp keeps the cap"
alt = "cmp eax, 0x34bc0"

# The HUD clock (0x573580) takes the timer back by one each time it is drawn at the cap, so it hides the clock while
# the tick keeps pushing the timer to 0x34BC0: one step back for each step forward.
[[site]]
va = 0x57359D
stock = "83c6ff 8935cc1e8000"
kind = "gate"
class = "c"
what = "HUD clock steps the battle timer back by one at its cap, once a period as the tick steps it forward"

# Off-field units (0x4371B0, the army layer, every tick) are checked for spawning in tenths: a unit whose index % 10
