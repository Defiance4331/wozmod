# The true frame rate catalogue (format: see the top of character.toml). This file: the AI and army layer.
#
# 0x4421E0 (from 0x4AF960 once a tick, no dt) runs the army and AI layer: 0x4371B0 spawns and despawns units,
# 0x4482C0 lets AI squads think (a round robin with a time budget), 0x439820 updates the off-field army units (the
# same), 0x4450E0 runs each AI squad's per-tick part (0x4486D0: wait timers, reactions, turning), 0x436810 counts each
# unit's combat and hazard time, 0x441CE0 times reinforcements. Turning in 0x4486D0's subtree steps the yaw by the
# character step chr+0x1908 times a stock angle (0x447080, 0x4476F0, 0x455FA0, 0x456DD0, 0x458AD0, 0x459370,
# 0x45BB90): the tick's share, which is what a per-tick turn needs.

# ---- Thinking: decisions at the stock rate. The AI's inputs (chr+0xEDC buttons, +0x188C move vector) and the units'
# targets persist between thinks; at stock the time budget already leaves some of them without a think on a tick.

[[site]]
va = 0x4421E0
stock = "e8cb4fffff"
kind = "gate"
class = "d"
what = """unit spawn and despawn pass (0x4371B0): its battle timer schedule (unit index % 10), the spawn radius ramp of
50 a call at 0x441540 and the spawn decisions run 60 times a second"""
code = "{call:0x4371b0}"

[[site]]
va = 0x4421E5
stock = "e8d6600000"
kind = "gate"
class = "d"
what = """AI squads' think (0x4482C0 round robin: goals, paths, the decision rolls of 0x447C10, the path-follow counter
0x4AA220 and the formation slot step 0x44C210) runs 60 times a second, each squad thinking once per stock tick"""
code = "{call:0x4482c0}"

# 0x439820 measures the calls a second from the performance counter and grows the soldier budget 0x140A340 above 55,
# shrinks it below, at most once per 60 calls (hysteresis 0x140A2CC). It runs every tick, so the threshold is N
# ticks' worth of 55/60, and the hysteresis counts 60 Hz periods. Its unit loop thinks at the stock rate.
[[site]]
va = 0x439920
stock = "890dcca24001"
kind = "gate"
class = "c"
what = """soldier budget hysteresis 0x140A2CC steps one toward 0 a tick; ecx, which the grow and shrink checks read,
keeps the count that did not move"""
alt = "mov ecx, dword ptr [0x140a2cc]"

[[site]]
va = 0x439983
stock = "8b3d64ab7e00 33ed eb03"
kind = "gate"
class = "d"
what = """army unit round robin (0x4397A0, 0x4396E0: targets, the 1-in-10 retarget roll of 0x439380, combat rounds,
hazard damage) runs 60 times a second; on the other ticks the cursor 0x7EAB64 is stored back unchanged"""
code = "mov edi, dword ptr [0x7eab64]; xor ebp, ebp"
alt = "mov edi, dword ptr [0x7eab64]; {jmp:0x439a4b}"

# ---- Army unit counts (0x436810 calls 0x434CA0 for each active unit once a tick; edi = unit).

# +0x64 counts ticks fighting (state 2; a combat round at 240 deals damage in proportion to it) and is zeroed out of
# combat; +0x68 counts ticks on a hazard cell (damage at 80, 160 or 320). On the other ticks eax = 0 adds nothing.
[[site]]
va = 0x434CA0
stock = "807f7802 b801000000 7505 014764 eb07"
kind = "gate"
class = "c"
what = "army unit combat count +0x64 and hazard count +0x68 (eax, added at 0x434CB7) step by one a tick"
code = """cmp byte ptr [edi+0x78], 2; mov eax, 1; jne 1f; add dword ptr [edi+0x64], eax; jmp 2f;
1: mov dword ptr [edi+0x64], 0; 2: {jmp:0x434cb7}"""
alt = "cmp byte ptr [edi+0x78], 2; mov eax, 0; je 2f; mov dword ptr [edi+0x64], 0; 2: {jmp:0x434cb7}"

