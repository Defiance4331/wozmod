# ---- Character-layer counts reached from the AI findings (inside a character's update: when = once).

# 0x417720 (from the character step, 0x40FEE0) charges the musou gauge by 0.125 x (1 + 0.1 x squad+0xA8) a call while
# the character holds the charge motion; 0x464660 keeps the fraction in 1/16 units (chr+0x1828), too coarse for a
# share of the step at a high rate, so the whole charge applies once per stock call. Its result is not read.
[[site]]
va = 0x41773C
stock = "e81fcf0400"
kind = "gate"
when = "once"
class = "a"
what = "musou charge while holding the charge button (0x464660 with 0.125 a call), once per stock character update"
code = "{call:0x464660}"

