# The defeat camera (0x4290C0, when the player's unit is beaten) hands 0x4259A0 the frame's dt as its rate b, with
# a = 0.25: a share of 1 at dt 1, but 0x429790 gives it dt = 60/N, a share of N/60 (above 1 the camera swings past its
# point every tick). It is the same snap as the other modes write it: a = 0.25 x 60 at b = 60 / dt ticks a second.
[[site]]
va = 0x4291DA
stock = "d9842484000000 83ec10 d95c240c 8d442430 d90528e76c00"
kind = "patch"
class = "e"
what = "defeat camera ease rate: dt as a divisor becomes 60 / dt ticks a second, with its rate 0.25 x 60 a second"
code = """fld dword ptr [0x6ce61c]; fdiv dword ptr [esp+0x84]; sub esp, 0x10; fstp dword ptr [esp+0xc];
lea eax, [esp+0x30]; fld dword ptr [0x6ce728]; fmul dword ptr [0x6ce61c]"""

