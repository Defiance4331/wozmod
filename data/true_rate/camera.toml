# The battle camera (format: see character.toml). Each tick 0x4AF600 turns each player's camera by the right stick
# (0x42E570), then calls 0x429790(controller, dt, 60.0), whose modes (follow 0x427E70, re-centre 0x427AA0, grab
# 0x4280D0, two-character 0x428250, slow motion 0x426060, throw 0x429270, defeat 0x4290C0) build a wanted eye and
# look-at point and move the camera toward them through 0x4259A0. Camera controllers: 0x9D1090, stride 0xF0; cameras
# 0x9DA958, stride 0x240 (eye +0x1C0, look-at +0x1D0). The post-update 0x507890 (0x4F9BD0 per camera) only rebuilds
# the view and projection matrices and the sound listener from that state: it steps nothing.

# ---- The eases. 0x429790 hands its modes a rate b, the ticks a second (60.0): each ease moves a share 4 a / b of the
# way a tick (a: the mode's rate, 4.0 at 0x6CE830: the spring's stiffness). The battle passes N, and the share becomes
# the one that keeps the stock speed: 1 - (1 - 4 a / 60)^(60 / b), the stock share at b = 60 (other callers of
# 0x429790 still pass 60). A share of 1 (a snap) or more has no slower equivalent and stays the share at 60.
[[site]]
va = 0x4AF779
stock = "d9051ce66c00"
kind = "operand"
operand = 2
type = "f32"
transform = "inverse"
class = "e"
what = "the camera's ticks a second (60.0) handed to 0x429790 by the battle: N"

[[site]]
va = 0x42DD3D
stock = "d944242c d8742430"
kind = "patch"
class = "b"
what = """eye height ease (0x42DD20, from 0x4259A0): its share 4 a / b a tick becomes 1 - (1 - 4 a / 60)^(60 / b), the
stock share at 60, the same speed at b ticks a second"""
code = """fld dword ptr [esp+0x2c]; fmul dword ptr [0x6ce830]; fdiv dword ptr [0x6ce61c];
fld1; fsub st(0), st(1); fstp st(1); fldz; fcomip st(0), st(1); jae 1f;
fld dword ptr [0x6ce61c]; fdiv dword ptr [esp+0x30]; fxch st(1); fyl2x;
fld st(0); frndint; fxch st(1); fsub st(0), st(1); f2xm1; fld1; faddp st(1), st(0); fscale; fstp st(1);
1: fld1; fsub st(0), st(1); fstp st(1); fdiv dword ptr [0x6ce830]"""

