# True frame rate catalogue (format: see character.toml): the character motion frame chr+0x18D8 (f32).
#
# 0x40D3A0 advances the frame by the character step times the playback rate (+0x18F0) each call. At 60 with rate 1
# the frame takes whole values, each for one stock tick, so a frame value k stands for the time [k, k+1) stock ticks
# after the motion began. At N ticks a second the frame passes through k + j x 60/N, so a test against an integer
# mark that is not of the form `frame >= a` / `frame < a` changes its answer up to one stock tick early: `frame > b`
# passes at b + 60/N instead of b + 1, and an inclusive window `a <= frame <= b` closes at b + 60/N. Those tests
# read the frame's whole part here: floor(frame + 1/1024) (the step 60/N is not exact in binary, so 44.99999 counts
# as 45), which gives the stock answer for every integer mark at any rate and equals the frame at 60. Reads that only
# sample poses, blends or root motion keep the fractional frame. Crossing tests (frame <= m < frame + step, or the
# integer-part change of the effect emitters) fire once per mark at any rate and need nothing, except where their
# width is not the tick's step (0x4210D0, 0x421C70).
#
# floor: push 0x3a800000 (1/1024); fadd; set the x87 rounding control to round down (fnstcw, and 0xF3FF, or 0x400,
# fldcw), frndint, put the control word back. The x87 stack depth and every register except EFLAGS stay as they
# were (the stack slot is popped with lea). Where the stock code truncates with _ftol (0x69CAB0) only 1/1024 is added.

# ---- The motion's end (0x40D3A0): `frame > last` (last = 0x4031A0, the motion's last frame index) ends a looping
# motion, starts the next one or (0x15) restarts it. The loops keep the fraction past the end (frame - (last + 1)).
# The motion that holds its last frame (next = -1, 0x40D835) keeps the stock test: it clamps to `last` either way,
# and a floored test there would let the drawn frame run past the last key and back each stock tick.
[[site]]
va = 0x40D535
stock = "d944240c d8d1 dfe0"
kind = "patch"
class = "e"
what = "motion end, looping motion (+0x20 & 0x40, fewer than 4 loops): ends when the frame's whole part passes last"
code = """fld dword ptr [esp+0xc]; fld st(1);
push 0x3a800000; fadd dword ptr [esp]; fnstcw word ptr [esp]; fnstcw word ptr [esp+2]; and word ptr [esp+2], 0xf3ff; or word ptr [esp+2], 0x400; fldcw word ptr [esp+2]; frndint; fldcw word ptr [esp]; lea esp, [esp+4];
fxch st(1); fcom st(1); fnstsw ax; fstp st(1)"""

