stock = "d9e8 51 d91c24"
kind = "patch"
class = "e"
what = "attached projectiles (chr+0x1870) are stepped by a stock tick (1.0): by the tick's share instead"
code = "fld dword ptr [{step}]; push ecx; fstp dword ptr [esp]"

