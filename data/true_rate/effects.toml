# ---- Weapon trails (0x491530, once a tick for each weapon from the pose stage 0x507890): each call starts a new
# history step (flips the double buffer +0xB, shifts the segment mask 10 bits, length +10 up to 62) and writes the
# newest samples from the weapon's current pose. The history steps once per 60 Hz period, so the trail covers the
# stock time; on the other ticks the same step is rewritten from the newer pose, so the trail's head stays on the
# blade. The draw (0x490F20) picks a buffer by the present index 0x140A290, which flips every present: at stock a
# slot's flip and the present's stay in step, at N they do not, and the draw would take the open step and the last
# finished one on alternate presents (a doubled, longer-looking trail). It reads the slot's own buffer instead.
