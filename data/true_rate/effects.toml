# Emitters of modes other than 1 and 2 (+4 & 7) emit +0x5C particles each update, a count per stock frame (modes 1
# and 2 emit +0x5C x dt). The fraction is carried in +0x64 (0x652EB0). Before this, the emitter's modifiers (list at
# +0x80, count +0x6C, type at +4, target field offset at +8; dispatch 0x75F1C0) run in list order and each one that
# targets +0x5C replaces it: a curve (types 0..3, 0x659B30: a function of a source field such as age) gives a rate a
# stock frame, as does the template's constant when nothing targets +0x5C. A key list (type 5, 0x659850, and type 14,
# 0x6599B0, times a base) gives the sum of the keys in this update's window [age, age + dt): a count that already
# follows real time (one-shot rings and sparks, e.g. Ma Chao's mounted charge, effect 0x72). So the last modifier that
# targets +0x5C decides: a key list's count is kept, a rate takes the tick's share.
[[site]]
va = 0x6534E0
stock = "d9465c eb29"
kind = "patch"
class = "a"
what = """particle emitter (mode 0, 3..7) emits +0x5C particles a stock frame: times the tick's share, unless the last
modifier that sets +0x5C is a key list (types 5, 14), whose count already covers this update's time"""
code = """fld dword ptr [{step}]; mov ecx, dword ptr [esi+0x6c]; lea edx, [esi+0x80];
next: test ecx, ecx; jz rate; dec ecx;
mov eax, dword ptr [edx]; lea eax, [eax+ecx*4]; add eax, edx; add eax, dword ptr [eax];
cmp dword ptr [eax+8], 0x5c; jne next;
cmp dword ptr [eax+4], 14; je count; cmp dword ptr [eax+4], 5; jne rate;
count: fstp st(0); fld1;
rate: fmul dword ptr [esi+0x5c]; {jmp:0x65350e}"""

