# ---- Projectiles and attack hit points (0x42C230: projectile, dt). The pool (0x9D12D8, 64 x 0x128) is updated once a
# tick from 0x506BC0, before the character loop; the four slots at chr+0x1870 from the character's own update
# (0x467A60). The motion, size and lifetime already take the projectile step; these terms were left without it.

# A character's attached projectiles get 1.0 as their dt: a stock tick's length, not this tick's.
