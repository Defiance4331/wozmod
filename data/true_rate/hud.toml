# True frame rate catalogue (format: see character.toml): the HUD, the menus drawn over a battle, and the counts the
# game steps once per drawn frame.
#
# Almost everything here runs once per drawn frame: in the battle draw (0x4B0E20 -> 0x573CF0, the HUD; character and
# scene drawing) or the frame end (0x4010B0: message windows, popups, fades). The battle scene draws and ends its
# frames in every one of its states, also those that run no battle tick (the menus over a battle, the results), and
# the modal message boxes (0x5ABA50, 0x56C340) present frames of their own. So these counts step on frame60, not
# tick60; only the minimap's update (at the end) runs in the battle tick.

# ---- The popup window 0xC2AF30 (frame end via 0x550FC0, and the modal loops): opening (state 1) counts 0xC2AF34
# from 8 down to 0, closing (state 3) from 0 up to 8; once open, 0xC2AF54 (choices) or 0xC2AF60 (message) count
# frames for the cursor blink (& 0x3F in 0x54E4A0) and the input delay (> 1). Input itself is read every frame.

