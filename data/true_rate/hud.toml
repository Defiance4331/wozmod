# ---- The count of presented frames 0xE0102C (+1 a present at 0x5D96EF) keeps stepping once a frame: eleven readers
# of its getter 0x5D8EC0 do a per-object step at most once a frame (+0x84 < count, 0x41DFD0 ... 0x4A5260). The
# readers that time an animation by it get instead the 60 Hz periods the presents span: floor(60 k / N) (eax, as the
# getter returns it; ecx and edx kept, as the getter keeps them).
# Twelve sprite animations step their frame (frame + 1) % count when the count is even (30 steps a second). They now
# step when the presents completed a period, (60 k) mod N < 60, and the period count is even. Below, ZF set = step,
# then eax = the count again.

[[site]]
va = 0x5337B0
stock = "e80b570a00 a801"
kind = "patch"
class = "c"
what = "sprite animation frame +0x1E58 steps every other frame (30 a second)"
code = """push edx; mov eax, dword ptr [0xe0102c]; mov edx, 60; mul edx; div dword ptr [{rate}];
cmp edx, 60; jb 1f; or al, 1; 1: test al, 1; pop edx; mov eax, dword ptr [0xe0102c]"""

