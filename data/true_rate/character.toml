# Knockback slide (0x405460): pos += speed * step, then speed *= 0.5 unless the motion has flag 0x20. The decay is
# per tick: 0.5^(60/N) keeps its rate, and the distance moved a tick takes decay_sum so the slide covers the stock
# distance at every 60 Hz period (the stock slide is a discrete series; a plain finer step would end 15% short).
[[slot]]
name = "knockback_decay_sum"
source = 0x6CE260
type = "f64"
transform = "decay_sum"
what = "knockback slide distance share per tick for the 0.5 decay"

[[site]]
va = 0x405493
stock = "d84c2418 d91c24"
kind = "patch"
class = "b"
what = "knockback slide distance this tick (speed x step), times decay_sum when the slide decays"
code = """fmul dword ptr [esp+0x18]; mov eax, dword ptr [ecx+0x18cc]; test byte ptr [eax+0x1c], 0x20; jne 1f;
fmul qword ptr [{slot:knockback_decay_sum}]; 1: fstp dword ptr [esp]"""

[[site]]
va = 0x405509
stock = "dc0d60e26c00"
kind = "operand"
operand = 2
type = "f64"
transform = "pow"
class = "b"
what = "knockback slide speed halves each stock tick"

