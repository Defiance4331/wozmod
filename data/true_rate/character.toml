# The true frame rate catalogue (data/true_rate/*.toml, one file per subsystem): every place in OROCHI_Z.exe that
# steps battle state once per tick (or once per drawn frame) without the frame's time, and how the runtime makes it
# step by real time at N ticks a second. Packed by src/wozmod/runtime/true_rate.py, applied by runtime/true_rate.h;
# at 60 every site keeps its stock bytes. This file: the character update. The format is described here once.
#
# kind:   operand (an instruction's constant address points at a transformed copy: scale, pow, ease, inverse),
#         patch (code runs in place of the stock bytes), gate (the stock bytes or code run only on the ticks that
#         complete a 60 Hz period, alt on the others).
# class:  a continuous step, b easing or decay, c count of ticks, d once-per-tick event, e dt misuse fixed here.
# Symbols in code: {step} f32 60/N, {step_d} f64 60/N, {tick60} u8, {slot:VA} the slot of an operand site at VA
# (hex, no 0x), {call:VA} and {jmp:VA} branches out of the thunk.

# The character step (0x412280: character, dt, far-update factor, flag) multiplies its dt in twice: once as the
# tick's length (dt times the character's attack and move speed, 0x403AA0) and once as the time scale of the speed
# modifiers (slow motion, 0x798314, hit stop, ...). The second must stay the time scale: dt / (60/N).
[[site]]
va = 0x412280
stock = "51 837c241400"
kind = "patch"
class = "e"
what = """character step entry: its dt argument without the tick's share is the time scale; the call's window (a far
character's update covers 6 ticks) is set for the counts below it"""
code = """push eax; push ecx; push edx; push dword ptr [esp+0x18]; call dword ptr [{character}]; add esp, 4;
pop edx; pop ecx; pop eax;
fld dword ptr [esp+8]; fdiv dword ptr [{step}]; fstp dword ptr [esp+8]; push ecx; cmp dword ptr [esp+0x14], 0"""

[[site]]
va = 0x412443
stock = "d9442404 8bc6"
kind = "patch"
class = "e"
what = "character step made (local at [esp+4]): times the tick's share, before it is stored at +0x1904/+0x1908"
code = "fld dword ptr [esp+4]; fmul dword ptr [{step}]; mov eax, esi"

