# True frame rate catalogue (format: see character.toml): the in-engine event scene (scene 6: frame 0x4B2DF0, tick
# 0x4B2640, draw 0x4B2680), and the weather it shares with the battle.
#
# The event timeline runs on the frame float. The scene's frame function 0x4B2DF0 gets the frame float (0x7C8500,
# 60/N) once a pass and hands it to 0x49CDF0, which adds it to the event clock (context +0x50, starting at 0) and to
# the camera path's time (+0x54, 0x499F50), steps the actors' motion times (0x4A1C40), the movers (0x49BFE0) and the
# sound timers (0x4A6640) by it, then runs every script command whose time the clock has reached (0x49D9A0); the
# event ends when the clock passes its length (+0x58). Commands (tables at 0x792198) only start things: captions
# (+0x20/+0x24, drawn by 0x49EAA0), voices (0x513720), cameras, actors, sounds, all advanced by the frame float, and
# the closing fade starts 20 stock ticks before the end; the fade ramps (0x5E0E80) step per frame (timers.toml).
# The tick chain (0x49CEB0 with the event context, not the frame float: 0x499AC0 cameras, 0x4A2D50 actor poses and
# reins, 0x49C4D0, 0x4A6DA0, then the battle's effects 0x5176A0 and HUD 0x5135C0) and the draw (0x49CFC0, 0x5045C0)
# run once a pass: what they step by a constant is below.

# ---- The motion clock's integer marks: at 60 an actor's motion time takes whole values (half values for the
# secondary motion, which steps by half the frame float), so `time > last frame` (strict) is "the time reached the
# motion's length" and a looping motion's reset to 0 (script flag 0x40, command 0.5) drops nothing. At N the time
# passes last + 60/N first: the loop would wrap up to a stock tick early every time round and drop its overshoot.
# Past the last frame the loop now waits until the time reaches the length (last + s, s the stock step: 1, or 0.5
# for the secondary motion; less 1/1024, as 60/N is not exact in binary) and wraps to the overshoot (time - last -
# s), which is 0 at 60. A held motion (no flag) keeps the stock step back: it is posed at its last frame either way.
[[site]]
va = 0x4A1CEF
stock = "ddd8 d9ee d95c2410"
kind = "patch"
class = "e"
what = "actor motion (0x89AA00) loop: wraps when the time reached the length (last frame [esp+0x14] + 1), to the overshoot"
code = """fld st(0); fisub dword ptr [esp+0x14]; fsub qword ptr [0x6ce3c8];
push 0xba800000; fcom dword ptr [esp]; lea esp, [esp+4]; fnstsw ax; test ah, 1; jnz 1f;
fstp st(1); jmp 2f; 1: fstp st(0); 2: fstp dword ptr [esp+0x10]"""

[[site]]
va = 0x4A1DB3
stock = "ddd8 d9ee d95c2410"
kind = "patch"
class = "e"
what = "actor secondary motion (0x89AA04, half steps) loop: wraps when the time reached last frame + 0.5, to the overshoot"
code = """fld st(0); fisub dword ptr [esp+0x14]; fsub qword ptr [0x6ce260];
push 0xba800000; fcom dword ptr [esp]; lea esp, [esp+4]; fnstsw ax; test ah, 1; jnz 1f;
fstp st(1); jmp 2f; 1: fstp st(0); 2: fstp dword ptr [esp+0x10]"""

