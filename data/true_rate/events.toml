# The event ends when its clock passes the length (+0x58 < +0x50, strict): at 60 on the first whole tick past it, at
# N one step past it, up to a stock tick early. The clock's whole part keeps the stock end (floor as in motion.toml).
[[site]]
va = 0x49CE79
stock = "d94650 83c404"
kind = "patch"
class = "e"
what = "event end (0x49CDF0): the event clock's whole part passed the event's length +0x58"
code = """fld dword ptr [esi+0x50];
push 0x3a800000; fadd dword ptr [esp]; fnstcw word ptr [esp]; fnstcw word ptr [esp+2]; and word ptr [esp+2], 0xf3ff; or word ptr [esp+2], 0x400; fldcw word ptr [esp+2]; frndint; fldcw word ptr [esp]; lea esp, [esp+4];
add esp, 4"""

# ---- The event dispatcher (0x49CEB0) runs one tick a pass, and when the pass took two ticks or more it runs the
# extra ticks first with the input and sound step (0x5ADE90) and the fade ramp (0x5E0E80) standing in for the frames
# it skipped, as the battle's catch-up does (clock.toml): those stand-ins take a 60 Hz period of the pass's own.
[[site]]
va = 0x49CF20
stock = "e86b0f1100 e8563f1400"
kind = "patch"
class = "c"
what = "event catch-up: a skipped frame's stand-in steps take a 60 Hz period of the pass's own"
code = """push eax; push ecx; push edx; push 1; call dword ptr [{frame}]; add esp, 4; pop edx; pop ecx; pop eax;
{call:0x5ade90}; {call:0x5e0e80};
push eax; push ecx; push edx; push 0; call dword ptr [{frame}]; add esp, 4; pop edx; pop ecx; pop eax"""

# ---- Horse reins (event 0x8D: ropes at 0x89AA80, made by 0x4A4260, hung by command 3.11 0x4A37B0), simulated once
# a tick from 0x4A2D50 by 0x50A580: Verlet, each node moves by its last tick's displacement plus the rope's gravity
# (+0x00..+0x0C, (0, 0.98, 0, 0) a stock tick squared), then 36 passes of length constraints (rest 4.6) pinned to the
# hands and the bit by 0x4A2BB0. The displacement already spans one tick of any length; the gravity is an
# acceleration times a stock tick squared, so a tick of 60/N takes it times (60/N)^2.
[[site]]
va = 0x50A5EE
stock = "d907 d844241c 8b4710 03c2 83c210 d95c241c d94704 d8442420 d95c2420 d94708 d8442424 d95c2424 d9470c d8442428 d95c2428"
kind = "patch"
class = "a"
what = "rein node step: the rope's gravity (a stock tick squared) times (60/N)^2, added to the node's displacement"
code = """fld dword ptr [edi]; fmul dword ptr [{step}]; fmul dword ptr [{step}]; fadd dword ptr [esp+0x1c];
mov eax, dword ptr [edi+0x10]; add eax, edx; add edx, 0x10; fstp dword ptr [esp+0x1c];
fld dword ptr [edi+4]; fmul dword ptr [{step}]; fmul dword ptr [{step}]; fadd dword ptr [esp+0x20]; fstp dword ptr [esp+0x20];
fld dword ptr [edi+8]; fmul dword ptr [{step}]; fmul dword ptr [{step}]; fadd dword ptr [esp+0x24]; fstp dword ptr [esp+0x24];
fld dword ptr [edi+0xc]; fmul dword ptr [{step}]; fmul dword ptr [{step}]; fadd dword ptr [esp+0x28]; fstp dword ptr [esp+0x28]"""

