# Route smoke for the screens that no check rule judges yet: each entry reaches the screen by route and takes
# its capture (the empty text selection passes, so a row only fails when the screen cannot be reached).
# Run it on any build with `tools/run_check.py --install DIR [--dll FILE] data/checks/routes.toml`.
# The Wei story chain, the victory still and the fusion weapon list (it unlocks every officer's weapons) are
# visited last; the story screens have no way back to the menu.

[[screen]]
name = "story-orochi-scenario"
route = "story-orochi-scenario"

  [[screen.assert]]
  kind = "text_has_ink"
  text = { caller = "0x1" }
  allow_empty = true

