# In-battle name banner: it sizes to the name, so every name ends where the label banner's text does, 77 px
# before the plate's end at the screen edge. Stage 40 posts officer banners on its own every 10-20 s from the
# start; the wait reads one once its plate holds still. The name is drawn by the runtime, so it is selected as the
# text drawn on the plate of banner types 2/4 and 5 (the row moves between stages).
[[screen]]
name = "battle-name-banner"
route = "battle"
wait = { box_caller = "0x5501dd|0x55006b", timeout = 120 }

  [[screen.assert]]
  kind = "text_position"
  text = { on_plate = "0x5501dd|0x55006b" }
  right = 1203
  tol = 2


  [[screen.assert]]
  kind = "text_on_one_line"    # glyph form: every letter ends on the line
  text = { on_plate = "0x5501dd|0x55006b" }

# Glyph form on a battle notice of known text: round and flat letters side by side ("Seize" is where a raised
# "iz" showed) and stems of every width ("minimum"). An officer name on a banner is too short and too varied to
# carry these checks.
[[screen]]
name = "battle-notice-glyphs"
route = "battle"
notice = "Seize the eastern garrison by minimum illumination"
wait = { caller = "0x550f0b", timeout = 30 }

  [[screen.assert]]
  kind = "text_stems_even"
  text = { caller = "0x550f0b" }

  [[screen.assert]]
  kind = "text_on_one_line"
  text = { caller = "0x550f0b" }

# Upgrade Skills after a skill is picked: the officers, and the chosen officer's weapons. Both draw their weapon list
# in the frame of FUN_00526db0, which English widens with the weapon row. The route unlocks the weapons and sets the
# first skill's count and a weapon's effect, so check visits them after the screens that need the plain save.
[[screen]]
name = "customize-upgrade-officers"
route = "customize-upgrade-officers"

  [[screen.assert]]
  kind = "ink_clear_of_quad_edge"   # the hint (4060.10) condenses into its strip, never cut at its quad's end (1183)
  quad = "4060.10"
  side = "right"

  [[screen.assert]]
  kind = "text_inset"               # officer names 10 into their row plates, drawn (unlogged) 22 into the frame
  box = "0x595ace"
  plate_x = 22

  [[screen.assert]]
  kind = "box_within_safe_area"     # every frame, plate and thumbnail inside x 64..1216

  [[screen.assert]]
  kind = "text_within_box"          # names inside the weapon list's frame
  text = { caller = "0x5950ec" }
  box = "0x526df1"

  [[screen.assert]]
  kind = "quad_within_box"          # pips inside the frame
  quad = "4079.*"
  caller = "0x59518b"
  box = "0x526df1"

[[screen]]
name = "customize-upgrade-weapons"
route = "customize-upgrade-weapons"

  [[screen.assert]]
  kind = "box_within_safe_area"     # every frame, plate and thumbnail inside x 64..1216

  [[screen.assert]]
  kind = "text_within_box"
  text = { caller = "0x5950ec" }
  box = "0x526df1"

  [[screen.assert]]
  kind = "quad_within_box"
  quad = "4079.*"
  caller = "0x59518b"
  box = "0x526df1"


# The weapon discard list after a battle's drop, when the officer holds 8 weapons. English grows its frame with the
# wider weapon row and moves it left, so its right edge (598) and the detail card beside it (612) stay put; the pips
# sit 416 px from the row's left edge, so they are the ones that hang out of an unmoved frame.
[[screen]]
name = "results-discard"
route = "results-discard"

  [[screen.assert]]
  kind = "box_within_safe_area"     # every frame, plate and thumbnail inside x 64..1216

  [[screen.assert]]
  kind = "text_within_box"          # names inside the frame
  text = { caller = "0x5950ec" }
  box = "0x584375"

  [[screen.assert]]
  kind = "quad_within_box"          # pips inside the frame
  quad = "4079.*"
  caller = "0x59518b"
  box = "0x584375"
