# Layout checks for the per-screen layout decisions (Old = MOZ positions, New = X360 positions, Mixed). Started
# from the earlier checks and routes.toml; the expected values are the decided layouts. One [[screen]] per screen; `check`
# visits them in its own order (fewest route edges, dead ends last), so the order here only breaks ties.
#
# Keys as in tools/screen_checks.py. Positions are layout px (1280x720). Texts the runtime draws itself (names, page text,
# condensed columns) have a DLL caller, so they are selected by draw position. The story-narration chain (main
# story narration and victory still) is a second dead end, so it is not in this file: one boot reaches only the
# Z-story chain.

# Help bar (Old): the panel hugs its text at full size, text at the stock y 642, right end 1184.
[[screen]]
name = "game-settings"
route = "game-settings"

  [[screen.assert]]
  kind = "no_cjk"

  [[screen.assert]]
  kind = "text_position"
  text = { caller = "0x55dfd8" }
  y = 642
  right = 1184

[[screen]]
name = "options-controller"
route = "options-controller"

  [[screen.assert]]
  kind = "text_position"
  text = { caller = "0x55dfd8" }
  y = 642
  right = 1184

[[screen]]
name = "gallery-original-background"
route = "gallery-original-background"

  [[screen.assert]]
  kind = "ink_clear_of_quad_edge"   # the label art stays inside the 252-wide quad window
  quad = "4064.5"
  side = "right"

  [[screen.assert]]
  kind = "text_position"
  text = { caller = "0x55dfd8" }
  y = 642
  right = 1184

