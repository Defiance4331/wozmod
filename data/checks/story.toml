# The main-story chain (a second dead end after the Z chain in layout.toml), so it needs its own boot:
# `tools/run_check.py --install DIR [--dll FILE] data/checks/story.toml`.

# Story narration (Old): the MOZ page in its box (wozmod.runtime.text_boxes "narration"); typed out, so its right end
# is the reported width.
[[screen]]
name = "story-narration"
route = "story-narration"
wait = { caller = "0x561111", timeout = 30 }

  [[screen.assert]]
  kind = "text_box"
  box = "narration"
  ink = false

# Story still text (New): the victory still is the camp-talk screen, in its box (text_boxes "camp").
[[screen]]
name = "story-victory-still"
route = "story-victory-still"

  [[screen.assert]]
  kind = "text_box"
  box = "camp"
