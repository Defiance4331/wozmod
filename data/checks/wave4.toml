  [[screen.assert]]
  kind = "line_count"
  text = { caller = "0x5a686c" }
  min = 3
  max = 4

  [[screen.assert]]
  kind = "text_clear_of_text"
  text = { caller = "0x5a6805" }
  other = { caller = "0x5a686c" }

  [[screen.assert]]
  kind = "text_position"
  text = { caller = "0x5a686c" }
  x = 549

