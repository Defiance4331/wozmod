# Layout checks for the screens the wave 4 in-game checks judged by hand (work/harness-plan/screens.md
# has the paths and the measurements these numbers come from). One [[screen]] per screen; `check` visits
# them in its own order (fewest route edges from where the last one ended, dead ends last), so the order here
# only breaks ties.
#
# name = label in the table; route = a route screen (tools/game_harness.ROUTE_SCREENS); fixture, battle,
# script = optional (script N fires in the battle, before the route goes on); wait = optional condition with
# the route-screen keys (texture, caller, x) plus timeout in s; assert = list of {kind = ...} from
# tools/screen_checks.ASSERTIONS. Select text by draw caller (or `match` regex) and textures by key.member
# (fnmatch). Never quote game text. A screen is reached only by route, never by hand-sent keys.
#
# Positions are layout px (1280x720). A lane is a text's x plus the width the draw squishes it into, so
# lane checks pass the capture through `text_within_edge` and measure the drawn ink, not the JSON width
# (`ink = false` for a text typed out letter by letter). Prompt bar (caller 0x55dfd8): y 652, right end
# 1192 on every screen that has one.

[[screen]]
name = "game-settings"
route = "game-settings"

  [[screen.assert]]
  kind = "no_cjk"

  [[screen.assert]]
  kind = "text_position"
  text = { caller = "0x55dfd8" }
  y = 652
  right = 1192

[[screen]]
name = "options-controller"
route = "options-controller"

  [[screen.assert]]
  kind = "no_cjk"

  [[screen.assert]]
  kind = "text_position"
