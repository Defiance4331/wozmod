  text = { caller = "0x539f9f" }
  edge = 1091

[[screen]]
name = "save-prompt"
route = "save-prompt"

  [[screen.assert]]
  kind = "no_cjk"

[[screen]]
name = "story-z-narration"
route = "story-z-narration"
wait = { caller = "0x55f31c", timeout = 30 }

  [[screen.assert]]
  kind = "text_position"            # the page text sits at (200, 507)
  text = { caller = "0x55f31c" }
  x = 200
  y = 507

  [[screen.assert]]
  kind = "text_within_edge"         # wrap 742; the page is typed out, so the capture holds only its start: use the reported width
  text = { caller = "0x55f31c" }
  edge = 942
  ink = false

  [[screen.assert]]
  kind = "line_count"
  text = { caller = "0x55f31c" }
  max = 3

  [[screen.assert]]
  kind = "text_has_ink"
  text = { caller = "0x55f31c" }

# The Z still event follows the narration (also no way out). Its names are drawn by the runtime, so they are
# selected by shape: one or more capitalised words, which the page text and prompt bar never are.
[[screen]]
name = "story-z-still"
route = "story-z-still-2"

  [[screen.assert]]
  kind = "text_centred_in_box"      # each name centred in its plate's dark box and inside it (lane 180)
  text = { match = "^[A-Z][a-z]+( [A-Z][a-z]+)*$" }
