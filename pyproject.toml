[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wozmod"
version = "0.1.0"
description = "Fan mod for the Japanese PC release of Musou Orochi Z: English text and gameplay patches"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["pillow>=12.1,<13"]

[project.scripts]
wozmod = "wozmod.__main__:main"

[project.gui-scripts]
wozmod-setup = "wozmod.window:main"

[project.optional-dependencies]
native = ["wozmod-native"]

[tool.uv.sources]
wozmod-native = { path = "native" }

[dependency-groups]
dev = [
    "capstone>=5,<6",
    "hypothesis>=6,<7",
    "numpy>=2,<3",
    "pytest>=9.0.2,<10",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15.12,<1",
]
build = ["pyinstaller>=6.19,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -n 6 --dist loadgroup"  # 6 workers: 4 to 16 all take 16-20 s, set by its slowest test; the rest is left for a game run
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
src = ["src", "tests", "tools"]
extend-exclude = ["work", "build", "native"]

[tool.ruff.lint]
# Pyflakes (unused or undefined names) and the bugbear checks that find real bugs here. B905 makes every zip
# say whether unequal lengths are an error (strict=True) or a deliberate cut; B023 and B019 only flagged safe code.
select = ["F", "B"]
ignore = ["B007", "B019", "B023"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["menusans.Axes"]  # a frozen dataclass, safe as a default
